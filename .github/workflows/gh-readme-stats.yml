# =============================================================================
# Update README stats / top-langs / streak cards
# -----------------------------------------------------------------------------
# WHAT THIS DOES
#   Regenerates the three "live" cards at the bottom of README.md:
#     profile/stats.svg       -> overall contribution stats
#     profile/top-langs.svg   -> most used languages
#     profile/streak.svg      -> current contribution streak
#   These change constantly (every push updates the streak), which is why this
#   file -- unlike generate-repo-cards.yml -- runs on a schedule.
#
# KEY DIFFERENCE FROM generate-repo-cards.yml
#   Pin cards (the project cards) change only when a repo's description or star
#   count changes -> regenerate on demand.
#   These three change with every commit -> regenerate daily on cron.
#
# SECRET: PAT_TOKEN
#   A personal access token used instead of the default GITHUB_TOKEN so the
#   generated cards can see PRIVATE repos (js-practice, musstr, etc.) and so the
#   workflow can push. If a card suddenly renders empty, check this secret first.
#
# TRIGGERS
#   - daily at 00:00 UTC
#   - manual dispatch
#   - any push that touches THIS file
# =============================================================================

name: Update README cards

on:
  # 00:00 UTC daily.
  schedule:
    - cron: "0 0 * * *"
  # Manual re-run without waiting for tomorrow: Actions tab -> Run workflow.
  workflow_dispatch:
  # Editing this file re-runs it immediately so you can preview option changes.
  push:
    paths:
      - '.github/workflows/gh-readme-stats.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # NOTE: theme=nord and border_radius are repeated in every `options` string.
      # The action takes no shared config, so changing the theme means editing all
      # three of these lines. Same for theme=nord in generate-repo-cards.yml --
      # keep them in sync by hand or the README ends up visually inconsistent.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AlyKazani04&rank_icon=percentile&show_icons=true&hide=prs&show=reviews,prs_merged&theme=nord&include_all_commits=true&border_radius=8
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AlyKazani04&layout=compact&langs_count=5&stats_format=percentages&theme=nord&hide=Jupyter%20Notebook,php&border_radius=6
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Different action/project than the one above, so it uses a different
      # `with` key (options, not card+options) and a pinned @main ref.
      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=AlyKazani04&theme=nord&border_radius=5.5
          path: profile/streak.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Same commit pattern as generate-repo-cards.yml: stage all of profile/,
      # then skip the commit entirely if nothing actually changed.
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || (git commit -m "chore: update dynamic README cards [skip ci]" && git push)